version: '3.8'

services:
  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: firenail_redis_prod
    restart: always
    expose:
      - "6379"  # Only accessible to other containers, not internet
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes  # Persist data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - firenail_network

  # FastAPI Backend (Production)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firenail_backend_prod
    restart: always
    ports:
      - "8000:8000"  # Expose to internet (or only to nginx if you add it)
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./.env.prod  # Production environment file
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - backend_storage_prod:/app/storage  # Persist generated thumbnails
    networks:
      - firenail_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    # Note: Removed --reload (dev only), added --workers for production

  # Celery Worker (Production)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firenail_celery_worker_prod
    restart: always
    command: celery -A app.celery.celery_app worker --loglevel=info --concurrency=2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./.env.prod
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_storage_prod:/app/storage  # Share storage with backend
    networks:
      - firenail_network

volumes:
  redis_data_prod:
    driver: local
  backend_storage_prod:
    driver: local

networks:
  firenail_network:
    driver: bridge
