<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firenail - Create Thumbnail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom focus ring color */
        .focus\:ring-fire {
            --tw-ring-color: #FF4D00;
        }
        /* Styling for the placeholder */
        .thumbnail-placeholder {
            background-image: url("data:image/svg+xml,%3csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3e%3crect width='100%25' height='100%25' fill='none' rx='16' ry='16' stroke='%23555555' stroke-width='2' stroke-dasharray='6%2c 14' stroke-dashoffset='0' stroke-linecap='square'/%3e%3c/svg%3e");
        }
    </style>
</head>
<body class="bg-[#1A1A1A] text-[#F5F5F5] antialiased">

    <!-- Header -->
    <header class="bg-[#2C2C2C]/50 backdrop-blur-sm border-b border-[#383838] fixed top-0 left-0 right-0 z-10">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                         <!-- SVG Logo -->
                        <svg class="h-8 w-8 text-[#FF4D00]" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12.71,2.52a1,1,0,0,0-1.42,0C8.32,5.48,8,8.28,8,10c0,4.41,4.41,6,4,9a1,1,0,0,0,2,0c-.39-2.9,4-4.59,4-9C18,8.28,17.68,5.48,14.71,2.52Z"/>
                            <path d="M12,12a4,4,0,0,0-4,4c0,1.1,2,3,4,3s4-1.9,4-3A4,4,0,0,0,12,12Z" opacity="0.5"/>
                        </svg>
                    </div>
                    <span class="text-xl font-bold ml-3 text-white">Firenail</span>
                </div>
                <div class="flex items-center">
                    <a href="#" class="text-gray-300 hover:bg-[#383838] px-3 py-2 rounded-md text-sm font-medium">Logout</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="pt-24">
        <div class="max-w-4xl mx-auto p-4">
            <h1 class="text-4xl font-bold text-center text-white">Create a Viral Thumbnail</h1>
            <p class="mt-2 text-center text-lg text-gray-400">Paste a video URL to generate a stunning thumbnail with AI.</p>
            
            <!-- URL Input Form -->
            <div class="mt-8">
                <div class="flex flex-col sm:flex-row gap-3">
                    <input type="url" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..."
                           class="flex-grow w-full px-5 py-4 bg-[#2C2C2C] border border-[#555555] rounded-lg text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-fire transition duration-200">
                    <input type="file" id="imageUpload" class="hidden" accept="image/*">
                    <button id="uploadBtn"
                            class="border border-[#FF4D00] text-[#FF4D00] font-bold py-4 px-8 rounded-lg hover:bg-[#FF4D00]/10 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#1A1A1A] focus:ring-fire transition duration-300">
                        Upload Photo
                    </button>
                    <button id="generateBtn"
                            class="bg-[#FF4D00] text-white font-bold py-4 px-8 rounded-lg hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-[#1A1A1A] focus:ring-fire transition duration-300 transform hover:scale-105">
                        Generate
                    </button>
                </div>
            </div>

            <!-- Thumbnail Display Area -->
            <div class="mt-10">
                <div id="thumbnail-container" class="w-full aspect-video bg-[#2C2C2C] rounded-2xl flex items-center justify-center p-4 transition-all duration-300 thumbnail-placeholder">
                    <!-- This content changes based on state -->
                    <div id="placeholder-content" class="text-center text-gray-500">
                        <svg class="mx-auto h-12 w-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                           <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 15.75 5.159-5.159a2.25 2.25 0 0 1 3.182 0l5.159 5.159m-1.5-1.5 1.409-1.409a2.25 2.25 0 0 1 3.182 0l2.909 2.909m-18 3.75h16.5a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H3.75A1.5 1.5 0 0 0 2.25 6v12a1.5 1.5 0 0 0 1.5 1.5Zm10.5-11.25h.008v.008h-.008V8.25Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                        </svg>
                        <p class="mt-4 text-lg font-medium">Your AI-generated thumbnail will appear here</p>
                    </div>

                    <div id="loading-content" class="hidden text-center text-gray-400">
                        <svg class="animate-spin h-10 w-10 text-[#FF4D00]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <p class="mt-4 text-lg">Generating thumbnail... this may take a moment.</p>
                    </div>

                    <img id="result-image" src="" alt="Generated Thumbnail" class="hidden w-full h-full object-cover rounded-2xl">
                </div>
            </div>

        </div>
    </main>
    
    <script>
        const generateBtn = document.getElementById('generateBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const imageUpload = document.getElementById('imageUpload');
        const placeholderContent = document.getElementById('placeholder-content');
        const loadingContent = document.getElementById('loading-content');
        const resultImage = document.getElementById('result-image');
        const thumbnailContainer = document.getElementById('thumbnail-container');

        // Function to show the final image
        const showImage = (src) => {
            placeholderContent.classList.add('hidden');
            loadingContent.classList.add('hidden');
            resultImage.src = src;
            resultImage.classList.remove('hidden');
            thumbnailContainer.classList.remove('thumbnail-placeholder');
        };

        generateBtn.addEventListener('click', () => {
            // 1. Hide placeholder, show loader
            placeholderContent.classList.add('hidden');
            resultImage.classList.add('hidden');
            loadingContent.classList.remove('hidden');
            thumbnailContainer.classList.remove('thumbnail-placeholder');

            // 2. Simulate AI processing
            setTimeout(() => {
                // 3. Hide loader, show result image
                const imageUrl = `https://placehold.co/1280x720/FF4D00/F5F5F5?text=Your+Awesome+Thumbnail!`;
                showImage(imageUrl);

            }, 3000); // Simulate a 3-second generation time
        });

        // Trigger file input when upload button is clicked
        uploadBtn.addEventListener('click', () => {
            imageUpload.click();
        });

        // Handle the file upload
        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    showImage(e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
