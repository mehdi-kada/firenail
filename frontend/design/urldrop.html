<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<title>Stitch Design</title>
<link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#ff4d00",
            "background": "#1a1a1a",
            "secondary-background": "#2C2C2C",
            "text": "#F5F5F5",
            "border": "#555555"
          },
          fontFamily: {
            "display": ["Space Grotesk", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "0.75rem",
            "xl": "1rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .generated-image-placeholder {
      background-color: #2C2C2C;}
  </style>
</head>
<body class="bg-background font-display text-text">




</header>
<main class="flex-grow container mx-auto px-4 sm:px-6 lg:px-8 py-12">
<div class="max-w-4xl mx-auto text-center">
<h2 class="text-4xl md:text-5xl font-bold tracking-tight">Generate Images from YouTube Videos</h2>
<p class="mt-4 text-lg text-text/80">Paste a YouTube URL below to get a summary and a generated image based on the video's transcript.</p>
</div>
<div class="mt-12 max-w-2xl mx-auto">
<div class="relative">
<input class="w-full h-14 pl-6 pr-36 rounded-full bg-secondary-background border border-border focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" placeholder="Enter YouTube video URL" type="url"/>
<button class="absolute inset-y-1.5 right-1.5 px-8 py-2 bg-primary text-white text-sm font-bold rounded-full hover:bg-opacity-90 transition-all">Generate</button>
</div>
</div>

</main>

</div>
</body></html>
