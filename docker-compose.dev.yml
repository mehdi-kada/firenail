version: '3.8'

services:
  # Redis Service
  redis:
    image: redis:7-alpine
    container_name: thumbnailai_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI Backend (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thumbnailai_backend_dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./.env.docker
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_storage_dev:/app/storage
    networks:
      - thumbnailai_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Celery Worker (Development)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thumbnailai_celery_worker_dev
    restart: unless-stopped
    command: celery -A app.celery.celery_app worker --loglevel=info --reload
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - ./.env.docker
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./backend:/app
      - backend_storage_dev:/app/storage
    networks:
      - thumbnailai_network

  # Celery Flower (Development)
  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thumbnailai_celery_flower_dev
    restart: unless-stopped
    command: celery -A app.celery.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - thumbnailai_network

  # Next.js Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
      args:
        - BUILDKIT_INLINE_CACHE=1
      cache_from:
        - thumbnailai_frontend_dev:latest
    container_name: thumbnailai_frontend_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    env_file:
      - ./.env.docker
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - thumbnailai_network
    command: pnpm run dev

volumes:
  redis_data_dev:
  backend_storage_dev:

networks:
  thumbnailai_network:
    driver: bridge
